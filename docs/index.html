    .arch-layer-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}

    .ph-hdr-1{background:rgba(255,54,33,.07);border:1.5px solid rgba(255,54,33,.2);border-bottom:none}
    .ph-hdr-2{background:rgba(34,211,238,.05);border:1.5px solid rgba(34,211,238,.14);border-bottom:none}

    @media(max-width:900px){
      .sl{padding:20px 14px}
      .gap-grid,.found-grid{grid-template-columns:1fr}
      .cat-grid{grid-template-columns:repeat(2,1fr)}
      .pr-arch{flex-direction:column;align-items:center}
      .pr-arrow-h{transform:rotate(90deg)}
      .pr-principles{flex-direction:column}
      .ph-timeline{flex-direction:column}
      .ph-divider{transform:rotate(90deg);margin-top:0;margin-bottom:0;height:28px}
      .arch-db-inner{grid-template-columns:1fr 1fr}
      .dots{display:none}
    }
    @media(max-width:600px){
      .cat-grid{grid-template-columns:1fr}
      .arch-db-inner{grid-template-columns:1fr}
    }
  `;
  document.head.appendChild(s);

  const app = document.getElementById('app');
  const pbar = document.createElement('div'); pbar.className = 'pbar'; app.appendChild(pbar);
  const dotsEl = document.createElement('div'); dotsEl.className = 'dots'; app.appendChild(dotsEl);

  const els = slides.map((sl, i) => {
    const el = document.createElement('div');
    el.className = 'sl' + (i === 0 ? ' on' : '');
    el.style.background = sl.bg;
    el.innerHTML = '<div class="sl-in">' + sl.body + '</div>';
    app.appendChild(el);
    return el;
  });

  slides.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' on' : '');
    d.onclick = e => { e.stopPropagation(); go(i); };
    dotsEl.appendChild(d);
  });

  function ui() {
    const sl = slides[cur];
    document.documentElement.style.setProperty('--ac', sl.accent);
    pbar.style.width = ((cur + 1) / slides.length * 100) + '%';
    pbar.style.background = sl.accent;
    pbar.style.boxShadow = '0 0 12px ' + sl.accent;
    dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === cur));
  }

  function go(idx) {
    if (moving || idx === cur || idx < 0 || idx >= slides.length) return;
    moving = true;
    const dir = idx > cur ? 'eu' : 'ed';
    const prev = els[cur], next = els[idx];
    prev.classList.remove('on'); prev.classList.add(dir);
    next.querySelectorAll('.A').forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; });
    next.classList.remove('eu', 'ed'); next.classList.add('on');
    cur = idx; ui();
    setTimeout(() => { prev.classList.remove('eu', 'ed'); moving = false; }, 550);
  }

  ui();

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go(cur + 1);
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') go(cur - 1);
  });

  let lastWheelT = 0;
  document.addEventListener('wheel', e => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastWheelT < 700) return;
    if (Math.abs(e.deltaY) < 10) return;
    lastWheelT = now;
    go(e.deltaY > 0 ? cur + 1 : cur - 1);
  }, { passive: false });

  let touchStartY = 0;
  document.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', e => {
    const dy = touchStartY - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 50) go(dy > 0 ? cur + 1 : cur - 1);
  }, { passive: true });

  app.addEventListener('click', e => {
    if (e.target.closest('.dot')) return;
    go(cur + 1);
  });

})();
</script>
