command:
  - "uvicorn"
  - "main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_CATALOG
    value: "flood_demo"
  # Schema must match the bundle deploy. With DAB's `mode: development` and the
  # default var.schema=montreal, the deployed schema name is prefixed to
  # `dev_<user>_montreal`. If you override `--var=schema=<name>` at deploy time,
  # update this to `dev_<user>_<name>` (or whatever the deploy target produces).
  - name: DATABRICKS_SCHEMA
    value: "montreal"
  - name: DEFAULT_AOI
    value: "greater_montreal"
  - name: MAX_CELLS_PER_REQUEST
    value: "50000"
  # On Databricks Apps these are normally injected from the SQL warehouse
  # resource binding. For local `uvicorn` set them (or a CLI profile) yourself.
  - name: DATABRICKS_HOST
    value: ""
  - name: DATABRICKS_HTTP_PATH
    value: ""
  # Underwriter chat (Genie Space). Provisioned by scripts/genie_bootstrap.py.
  # Databricks Apps deploys this file verbatim (no `${var.X}` substitution),
  # so set the space id after bootstrap - same pattern as HOST/HTTP_PATH.
  # Leave empty to hide the chat panel.
  - name: DATABRICKS_GENIE_SPACE_ID
    value: ""
