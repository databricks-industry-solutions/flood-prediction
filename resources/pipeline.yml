resources:
  jobs:
    flood_pipeline:
      name: "[${bundle.target}] Flood Prediction Pipeline"
      description: "End-to-end GeoBrix + Spatial SQL flood prediction pipeline. Iterates over every entry in var.aois_json so a single deploy can populate multiple AOIs into the same catalog."
      tags:
        demo: "flood-prediction"

      job_clusters:
        - job_cluster_key: geobrix_cluster
          new_cluster:
            # GeoBrix v0.2.0 targets DBR 17.3; DBR 17.1+ has built-in Spatial SQL.
            spark_version: "17.3.x-scala2.13"
            # Modern AMD v5 SKU - 4 vCPU / 16 GB. Switched from Standard_DS3_v2
            # because that older SKU hits regional capacity limits.
            node_type_id: "Standard_D4ads_v5"
            num_workers: 2
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            spark_conf:
              spark.databricks.geo.st.enabled: "true"
              # Required for the per-AOI partition writes the notebooks do —
              # without dynamic mode, mode("overwrite") wipes the entire
              # table on every run, defeating multi-AOI co-residence.
              spark.sql.sources.partitionOverwriteMode: "dynamic"
            # Stream init-script + driver/executor logs to the demo volume so
            # we can `cat` them when something like INIT_SCRIPT_FAILURE happens.
            cluster_log_conf:
              volumes:
                destination: /Volumes/${var.catalog}/${resources.schemas.flood_schema.name}/${var.volume}/_cluster_logs
            init_scripts:
              # Workspace-file init script fetches GeoBrix JAR + native libs
              # from the public GitHub release at cluster start; no Volume needed.
              - workspace:
                  destination: ${workspace.file_path}/src/bootstrap/geobrix-gdal-init.sh

      # Each pipeline stage is a `for_each_task` that fans out over every entry
      # in var.aois_json. Stages run sequentially (silver waits for ingest of
      # *all* AOIs, etc.) but iterations within a stage can run in parallel up
      # to var.for_each_concurrency. The job cluster is reused across iterations.
      tasks:
        - task_key: ingest
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: ingest_aoi
              job_cluster_key: geobrix_cluster
              notebook_task:
                notebook_path: ../notebooks/01_ingest.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  aoi_name: "{{input.name}}"
                  aoi_bbox_min_lon: "{{input.min_lon}}"
                  aoi_bbox_min_lat: "{{input.min_lat}}"
                  aoi_bbox_max_lon: "{{input.max_lon}}"
                  aoi_bbox_max_lat: "{{input.max_lat}}"
                  raw_root: /Volumes/${var.catalog}/${resources.schemas.flood_schema.name}/${var.volume}
                  flood_source: "{{input.flood_source}}"
                  cems_urls: "{{input.cems_urls}}"
                  cems_year_default: "{{input.cems_year_default}}"
              libraries:
                - pypi:
                    package: "requests==2.32.3"
                - pypi:
                    package: "shapely==2.0.4"

        - task_key: silver
          depends_on:
            - task_key: ingest
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: silver_aoi
              job_cluster_key: geobrix_cluster
              notebook_task:
                notebook_path: ../notebooks/02_silver_geobrix.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  volume: ${var.volume}
                  aoi_name: "{{input.name}}"
                  aoi_bbox_wkt: "{{input.wkt}}"
                  h3_resolution: ${var.h3_resolution}
              libraries:
                # JAR + GDAL natives come from the init script; wheel is shipped in the bundle.
                - whl: ${workspace.file_path}/src/bootstrap/wheels/geobrix-0.2.0-py3-none-any.whl
                - pypi:
                    package: "h3==4.1.0"
                - pypi:
                    package: "rasterio==1.3.10"
                - pypi:
                    package: "shapely==2.0.4"

        - task_key: gold
          depends_on:
            - task_key: silver
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: gold_aoi
              job_cluster_key: geobrix_cluster
              notebook_task:
                notebook_path: ../notebooks/03_gold_features_labels.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  aoi_name: "{{input.name}}"
                  h3_resolution: ${var.h3_resolution}
                  scenarios_24h_mm: ${var.scenarios_24h_mm}
              libraries:
                - pypi:
                    package: "h3==4.1.0"

        - task_key: train_and_score
          depends_on:
            - task_key: gold
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: train_and_score_aoi
              job_cluster_key: geobrix_cluster
              notebook_task:
                notebook_path: ../notebooks/04_train_and_score.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  aoi_name: "{{input.name}}"
                  model_name: ${var.catalog}.${resources.schemas.flood_schema.name}.${resources.registered_models.flood_rf.name}
                  scenarios_24h_mm: ${var.scenarios_24h_mm}
              libraries:
                - pypi:
                    package: "mlflow>=2.14.0"
                - pypi:
                    package: "h3==4.1.0"
