resources:
  jobs:
    flood_pipeline:
      name: "[${bundle.target}] Flood Prediction Pipeline"
      description: "End-to-end GeoBrix + Spatial SQL flood prediction pipeline. Iterates over every entry in var.aois_json so a single deploy can populate multiple AOIs into the same catalog."
      tags:
        demo: "flood-prediction"

      # Serverless. There is no cluster to size, no init script, and no
      # cloud-specific node SKU — the bundle deploys unchanged on AWS, Azure and
      # GCP. This is possible because we use the GeoBrix *lightweight* tier: a
      # pure-Python (rasterio-backed) implementation of the same gbx_rst_*
      # functions, with no JAR and no GDAL native libraries to install.
      #
      # Spatial SQL (ST_*) and the H3 built-ins are part of serverless already,
      # so nothing extra is needed for those.
      environments:
        - environment_key: ingest
          spec:
            environment_version: "4"
            dependencies:
              - "requests==2.32.3"
              - "shapely==2.0.4"

        # Notebook 02 installs GeoBrix itself with a notebook-scoped `%pip`, so
        # this environment is intentionally empty. Declaring the wheel here
        # instead fails on workspaces whose serverless environment builder
        # cannot fetch external packages, and notebook-scoped installs are what
        # propagate to the Python workers running the gbx_rst_* table functions.
        - environment_key: geobrix
          spec:
            environment_version: "4"
            dependencies: []

        - environment_key: gold
          spec:
            environment_version: "4"
            dependencies:
              - "h3>=4.1,<5"

        - environment_key: train
          spec:
            environment_version: "4"
            dependencies:
              - "mlflow>=2.14.0"
              - "h3>=4.1,<5"

      # Each pipeline stage is a `for_each_task` that fans out over every entry
      # in var.aois_json. Stages run sequentially (silver waits for ingest of
      # *all* AOIs, etc.) but iterations within a stage can run in parallel up
      # to var.for_each_concurrency.
      tasks:
        - task_key: ingest
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: ingest_aoi
              environment_key: ingest
              notebook_task:
                notebook_path: ../notebooks/01_ingest.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  aoi_name: "{{input.name}}"
                  aoi_bbox_min_lon: "{{input.min_lon}}"
                  aoi_bbox_min_lat: "{{input.min_lat}}"
                  aoi_bbox_max_lon: "{{input.max_lon}}"
                  aoi_bbox_max_lat: "{{input.max_lat}}"
                  raw_root: /Volumes/${var.catalog}/${resources.schemas.flood_schema.name}/${var.volume}
                  flood_source: "{{input.flood_source}}"
                  cems_urls: "{{input.cems_urls}}"
                  cems_year_default: "{{input.cems_year_default}}"

        - task_key: silver
          depends_on:
            - task_key: ingest
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: silver_aoi
              environment_key: geobrix
              notebook_task:
                notebook_path: ../notebooks/02_silver_geobrix.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  volume: ${var.volume}
                  aoi_name: "{{input.name}}"
                  aoi_bbox_wkt: "{{input.wkt}}"
                  h3_resolution: ${var.h3_resolution}

        - task_key: gold
          depends_on:
            - task_key: silver
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: gold_aoi
              environment_key: gold
              notebook_task:
                notebook_path: ../notebooks/03_gold_features_labels.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  aoi_name: "{{input.name}}"
                  h3_resolution: ${var.h3_resolution}
                  scenarios_24h_mm: ${var.scenarios_24h_mm}

        - task_key: train_and_score
          depends_on:
            - task_key: gold
          for_each_task:
            inputs: ${var.aois_json}
            concurrency: ${var.for_each_concurrency}
            task:
              task_key: train_and_score_aoi
              environment_key: train
              notebook_task:
                notebook_path: ../notebooks/04_train_and_score.py
                base_parameters:
                  catalog: ${var.catalog}
                  schema: ${resources.schemas.flood_schema.name}
                  volume: ${var.volume}
                  aoi_name: "{{input.name}}"
                  model_name: ${var.catalog}.${resources.schemas.flood_schema.name}.${resources.registered_models.flood_rf.name}
                  scenarios_24h_mm: ${var.scenarios_24h_mm}
                  h3_resolution: ${var.h3_resolution}
